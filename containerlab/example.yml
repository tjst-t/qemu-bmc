# Two nodes that boot their own disk, BMCs published on the host.
#
#   host :8441 (Redfish/noVNC) :6231/udp (IPMI) ── node1 BMC
#   host :8442 (Redfish/noVNC) :6232/udp (IPMI) ── node2 BMC
#
#   node1 VM NIC (eth1) ──────────── node2 VM NIC (eth1)   data network
#
# Each node boots containerlab/vm/<node>/disk.qcow2, created empty (20G) at
# the first start by VM_DISK_SIZE; an existing disk (e.g. a copied cloud
# image) is used as is. An empty disk just sits in the BIOS until you install
# on it: put ISOs in containerlab/iso/ and set VM_CDROM to boot one.
# For a separate BMC management network, see mgmt-network.yml.
name: qemu-bmc-lab

topology:
  defaults:
    kind: linux
    image: ghcr.io/tjst-t/qemu-bmc:0.8

  nodes:
    node1:
      devices:
        - /dev/net/tun  # needed for the VM NIC (eth1 is passed through)
      binds:
        - vm/node1:/vm
        - iso:/iso:ro
      ports:
        - "8441:443"        # Redfish HTTPS + noVNC (https://localhost:8441/novnc/)
        - "6231:623/udp"    # IPMI
      env:
        VM_MEMORY: "2048"
        VM_CPUS: "2"
        VM_BOOT_MODE: "bios"
        VM_DISK_SIZE: "20G"  # creates /vm/disk.qcow2 if it is missing
        VM_NETWORKS: "eth1"
        IPMI_USER: "admin"
        IPMI_PASS: "password"
        # VM_CDROM: "/iso/installer.iso"

    node2:
      devices:
        - /dev/net/tun
      binds:
        - vm/node2:/vm
        - iso:/iso:ro
      ports:
        - "8442:443"
        - "6232:623/udp"
      env:
        VM_MEMORY: "2048"
        VM_CPUS: "2"
        VM_BOOT_MODE: "uefi"
        VM_DISK_SIZE: "20G"
        VM_NETWORKS: "eth1"
        IPMI_USER: "admin"
        IPMI_PASS: "password"

  links:
    # data network (VM NICs)
    - endpoints: ["node1:eth1", "node2:eth1"]
